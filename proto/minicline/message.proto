syntax = "proto3";

package minicline;

import "minicline/common.proto";


service MessageService {
  rpc subscribeToMessage(EmptyRequest) returns (stream Message);
}

message Message {
    string content = 1;
    MessageOwn owner = 2;
}

enum MessageOwn {
    SYSTEM = 0;
    ASSISTANT = 1;
    USER = 2;
}
